aid: zenlist

name: Zenlist

image: https://21517349.fs1.hubspotusercontent-na1.net/hubfs/21517349/Images%20for%20website/ZenlistBannerBig.jpg

description: Zenlist is a collaborative home-search platform for real estate agents and their clients, with MLS-level search
  on MLS inventory, in-app chat, listing notes, showing requests and itineraries across Mac, Windows, iOS and Android apps,
  and enterprise offerings for brokerages, teams and MLSs (for example the SFAR MLS mobile app). It contributes open-source
  RESO tooling on GitHub, including a Rust implementation of RESO RCP-19 RETS validation expressions with compliance tests,
  and runs a public Rules Playground (rules.zenlist.dev) for listing validation rules. Zenlist publishes no public API, developer
  documentation or machine-readable contract.

